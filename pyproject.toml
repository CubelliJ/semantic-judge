[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-judge"
version = "0.1.0"
description = "Local semantic classification through constrained next-token logit scoring"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.2,<3",
  "transformers>=4.50,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
