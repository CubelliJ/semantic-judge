[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-judge"
version = "0.1.0"
description = "Local semantic classification through constrained next-token logit scoring"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.2,<3",
  "transformers>=4.50,<5",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
training = [
  "datasets>=3,<4",
  "peft>=0.14,<1",
  "matplotlib>=3.8,<4",
]
quantized = ["llama-cpp-python==0.3.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
